[package]
name = "pliny"
version = "0.0.1"
edition = "2024"
authors = ["jordotech"]
description = "Terraform plan comprehension TUI with AI risk summaries"
license = "Apache-2.0"
repository = "https://github.com/jordotech/pliny"
readme = "README.md"
keywords = ["terraform", "tui", "infrastructure", "openai", "ratatui"]
categories = ["command-line-utilities", "visualization"]

[[bin]]
name = "pliny"
path = "src/main.rs"

[[bin]]
name = "gen-mega-fixture"
path = "src/bin/gen_mega_fixture.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tui-tree-widget = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[dev-dependencies]
insta = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
